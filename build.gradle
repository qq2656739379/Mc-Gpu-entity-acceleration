plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0.0'
group = 'com.gpuaccel.entitymod'

base {
    archivesName = 'gpu-entity-acceleration'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

configurations {
    shade
    implementation.extendsFrom(shade)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    
    // Add Mixin config
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '-mixin.config=gpuaccel.mixins.json'

            mods {
                gpuaccel {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'gpuaccel', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                gpuaccel {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets {
    main {
        java {
            srcDir 'src/stub/java'
        }
    }
}

repositories {
    mavenCentral()
    maven { url 'https://maven.minecraftforge.net/' }
    maven { url 'https://maven.blamejared.com' } // Patchouli
    maven {
        url 'https://www.cursemaven.com'
        content { includeGroup "curse.maven" }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    
    // JOCL for GPU acceleration (OpenCL)
    shade 'org.jocl:jocl:2.0.6'
    shade 'org.apache.commons:commons-math3:3.6.1'
    shade 'org.lwjgl:lwjgl-opencl:3.3.1'
    shade 'org.lwjgl:lwjgl:3.3.1'
    shade 'org.lwjgl:lwjgl:3.3.1:natives-windows'
    shade 'org.lwjgl:lwjgl:3.3.1:natives-linux'

    // Mixin
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Dependencies for TFC integration
    compileOnly fg.deobf("vazkii.patchouli:Patchouli:1.20.1-84-FORGE")

    // TFC Dependency - Using a placeholder ID.
    // Please replace '0000000' with the actual File ID for TFC 1.20.1 (e.g. from CurseForge)
    // implementation fg.deobf("curse.maven:terrafirmacraft-302973:0000000")
}

mixin {
    add sourceSets.main, "gpuaccel.mixins.json"
    config "gpuaccel.mixins.json"
    config "gpuaccel.mixins.tfc.json"
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            'Specification-Title'     : 'GPU Entity Acceleration',
            'Specification-Vendor'    : 'GPUAccel',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'GPUAccel',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs'            : 'gpuaccel.mixins.json,gpuaccel.mixins.tfc.json'
        ])
    }
    // Exclude TFC Stubs from final jar
    exclude 'net/dries007/**'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

shadowJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveClassifier.set('')
    configurations = [project.configurations.shade]
    relocate 'org.apache.commons.math3', 'com.gpuaccel.shaded.commons.math3'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    // Exclude TFC Stubs from shadow jar
    exclude 'net/dries007/**'
}

tasks.jar.configure {
    archiveClassifier.set('slim')
}
tasks.jar.finalizedBy([])

reobf {
    shadowJar {}
}

tasks.shadowJar.finalizedBy('reobfShadowJar')
tasks.build.dependsOn(tasks.named('reobfShadowJar'))
